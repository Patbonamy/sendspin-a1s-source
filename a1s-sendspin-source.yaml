esphome:
  name: sendspin-source-1
  friendly_name: Sendspin Source 1
  min_version: 2026.8.0
  on_boot:
    priority: -100
    then:
      # LINE2 is the 3.5 mm line-in jack; LINE1 is the onboard mics
      - select.set:
          id: adc_input
          option: LINE2
      # The es8388 driver sets the ADC up for voice capture; put it back to plain line-level capture
      - lambda: |-
          // ADCCONTROL4: 16-bit I2S framing. The driver writes 0x0D (left-justified) but i2s_audio reads Philips
          // I2S, which is one bit late: every sample loses its sign bit and L/R swap. ESP-ADF writes 0x0C here.
          id(es8388_dac)->write_byte(0x0C, 0x0C);
          // ADCCONTROL3: explicitly select stereo ADC capture rather than the driver's mono-right setting.
          // This is a controlled test for thin/reduced-depth LINE2 audio; it does not fix physical mic bleed.
          id(es8388_dac)->write_byte(0x0B, 0x00);
          // ADCCONTROL10: ALC off (the driver's voice ALC pumps music); PGA gain stays at ADCCONTROL1's 0 dB
          id(es8388_dac)->write_byte(0x12, 0x22);
          {
            float gain = id(input_gain).state;
            uint8_t g = std::isnan(gain) ? 8 : (uint8_t) (gain / 3);
            id(es8388_dac)->write_byte(0x09, (g << 4) | g);
          }
          // ADCCONTROL14: noise gate off (the driver's gate mutes the ADC below -40.5 dBFS)
          id(es8388_dac)->write_byte(0x16, 0x00);

esp32:
  board: esp-wrover-kit
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 80MHZ
  
logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

wifi:
  power_save_mode: none
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Sendspin 1 Fallback Hotspot
    password: !secret ap_password
  manual_ip:
    static_ip: 192.168.1.200
    gateway: 192.168.1.254
    subnet: 255.255.255.0
    
captive_portal:
# Enable Web server
web_server:
  port: 80
external_components:
  # To iterate on the component without pushing, use `source: {type: local, path: components}` from a clone
  - source: github://Patbonamy/sendspin-a1s-source@main
    components: [sendspin]
    refresh: always

time:
  - platform: homeassistant
    id: homeassistant_time
    
# Text sensors with general information
text_sensor:
  # Expose WiFi information as sensors
  - platform: wifi_info
    ip_address:
      name: IP
    ssid:
      name: SSID
    bssid:
      name: BSSID    

# Sensors with general information
sensor:
  # WiFi Signal sensor
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s

  # MCU Temperature
  - platform: internal_temperature
    name: Temperature

i2c:
  sda: GPIO33
  scl: GPIO32
  # Expect 0x10 (ES8388). 0x1A is the AC101 variant, which this config does not support.
  scan: true

audio_dac:
  - platform: es8388
    id: es8388_dac
    
# Input gain selector
number:
  - platform: template
    name: "Input Gain"
    id: input_gain
    min_value: 0
    max_value: 24
    step: 3
    initial_value: 24
    unit_of_measurement: "dB"
    mode: slider
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          uint8_t g = (uint8_t) (x / 3);
          id(es8388_dac)->write_byte(0x09, (g << 4) | g);

select:
  - platform: es8388
    es8388_id: es8388_dac
    adc_input_mic:
      id: adc_input
      name: ADC Input

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO25
    i2s_bclk_pin: GPIO27
    i2s_mclk_pin: GPIO0

microphone:
  - platform: i2s_audio
    id: a1s_adc
    adc_type: external
    i2s_din_pin: GPIO35
    pdm: false
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: stereo

sendspin:
  id: sendspin_hub
  task_stack_in_psram: true
  source:
    microphone:
      microphone: a1s_adc
      channels: [0, 1]

binary_sensor:
  - platform: gpio
    name: "Pairing Button"
    pin:
      number: GPIO36
      inverted: true
    on_press:
      - sendspin.confirm_pairing_window:

button:
  - platform: template
    name: "Accept pairing"
    on_press:
      - sendspin.confirm_pairing_window:
  - platform: restart
    name: Restart
